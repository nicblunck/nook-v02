name: Nook
options:
  bundleIdPrefix: com.nicolasblunck
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  DEVELOPMENT_TEAM: U4K77TMBRU
  CODE_SIGN_STYLE: Automatic
packages:
  NookLibrary:
    path: Packages/NookLibrary
targets:
  Nook-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Nook/Sources]
    resources: [Nook/Resources]
    dependencies:
      - package: NookLibrary
        product: NookLibrary
      - target: NookShareExtension
        embed: true
    info:
      path: Nook/Sources/iOS-Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.nook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Nook/Sources/Nook.entitlements

  # Saves straight into the shared library container, so something shared from
  # Safari is in the library before the app is ever opened.
  NookShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Nook/ShareExtension]
    dependencies:
      - package: NookLibrary
        product: NookLibrary
    info:
      path: Nook/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Nook
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        PRODUCT_NAME: Save to Nook
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.nook.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Nook/ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nook/ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  Nook-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [Nook/Sources]
    resources: [Nook/Resources]
    dependencies:
      - package: NookLibrary
        product: NookLibrary
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: com.nicolasblunck.nook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
schemes:
  Nook-iOS:
    build:
      targets:
        Nook-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Nook-macOS:
    build:
      targets:
        Nook-macOS: all
    run:
      config: Debug
    archive:
      config: Release
